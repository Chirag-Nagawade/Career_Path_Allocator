<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MargIntel - PDF Reports</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-graduation-cap text-sage"></i>
            <h2>MargIntel</h2>
        </div>
        
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li><a href="assessment.html" id="nav-assessment"><i class="fa-solid fa-clipboard-list"></i> Assessment</a></li>
            <li><a href="strength.html" id="nav-strength"><i class="fa-solid fa-dumbbell"></i> Strength Analysis</a></li>
            <li><a href="prediction.html" id="nav-prediction"><i class="fa-solid fa-bullseye"></i> Career Prediction</a></li>
            <li><a href="reports.html" class="active"><i class="fa-solid fa-file-pdf"></i> PDF Reports</a></li>
            <li class="menu-divider"></li>
            <li><a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a></li>
            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
            <li id="admin-nav" style="display: none;"><a href="admin.html"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a></li>
        </ul>
        
        <div class="sidebar-footer">
            <a href="#" onclick="logout(event)"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <button class="mobile-toggle" id="mobile-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="header-user">
                <span id="welcome-msg">Welcome, User</span>
                <div class="user-avatar" id="user-avatar-initial">U</div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="page-title">
                <h1>Official Report Generation</h1>
                <p>Download a comprehensive, printable breakdown of your entire profile.</p>
            </div>

            <div id="report-container">
                <div class="loading-state" id="loading-spinner">
                    <i class="fa-solid fa-spinner fa-spin"></i> Checking availability...
                </div>

                <!-- Inner Content Injected via JS -->
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('margintel_user') || '{}');
            if (!user.email) return window.location.href = 'login.html';

            document.getElementById('welcome-msg').textContent = `Welcome, ${user.full_name || 'Student'}`;
            document.getElementById('user-avatar-initial').textContent = (user.full_name || 'U').charAt(0).toUpperCase();
            if (user.role === 'admin') document.getElementById('admin-nav').style.display = 'block';

            const container = document.getElementById('report-container');
            const spinner = document.getElementById('loading-spinner');

            if (!user.assessment_completed) {
                spinner.style.display = 'none';
                container.innerHTML = `
                    <div class="empty-state-card">
                        <i class="fa-solid fa-lock empty-icon"></i>
                        <h3>Report Unavailable</h3>
                        <p>You must complete your assessment to generate an official PDF report.</p>
                        <a href="assessment.html" class="btn-primary mt-3">Take Assessment</a>
                    </div>
                `;
                return;
            }

            // Assessment complete, show preview & download card
            spinner.style.display = 'none';
            container.innerHTML = `
                <div class="summary-card text-center" style="max-width: 600px; margin: 0 auto; padding: 60px 40px;">
                    <i class="fa-solid fa-file-pdf" style="font-size: 4rem; color: #D9534F; margin-bottom: 24px;"></i>
                    <h2>Your Personalized Career Report</h2>
                    <p class="text-muted mt-3 mb-4">This 3-page summary includes your primary prediction, academic history, psychometric radar charts, and actionable career steps formatted beautifully for print or email.</p>
                    <button id="downloadBtn" class="btn-primary btn-lg" onclick="triggerDownload()">
                        <i class="fa-solid fa-download mr-2"></i> Download Full PDF
                    </button>
                    <p class="text-muted mt-4" style="font-size: 0.85rem;" id="dl-status"></p>
                </div>
            `;

            document.getElementById('mobile-toggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('active');
            });
        });

        async function triggerDownload() {
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('dl-status');
            const token = localStorage.getItem('margintel_token');
            const user = JSON.parse(localStorage.getItem('margintel_user') || '{}');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Compiling PDF...';
            status.textContent = 'Our servers are generating your personalized report. This may take a few seconds.';

            try {
                const response = await fetch(`${API_BASE_URL}/reports/download`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error('Could not generate report from server.');
                }

                // Blob handling for PDF download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${user.full_name || 'User'}_MargIntel_Report.pdf`.replace(/ /g, "_");
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                a.remove();
                window.URL.revokeObjectURL(url);

                status.textContent = 'Download Complete! Check your downloads folder.';
                status.style.color = 'var(--primary)';
            } catch (err) {
                status.textContent = err.message;
                status.style.color = 'var(--error)';
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-download mr-2"></i> Download Full PDF';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
